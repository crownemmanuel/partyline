# Every push to main (and Actions → Build → Run workflow) builds the desktop app for macOS,
# Windows and Linux and keeps the installers as workflow artifacts for 14 days: a quick way to try
# a change on another OS before cutting a release. Pull requests run the checks only.
# These builds have no update files; releases come from release.yml (docs/RELEASES.md).
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "**.md", "apps/ios/**", "apps/android/**"]
  pull_request:
    paths-ignore: ["website/**", "docs/**", "**.md", "apps/ios/**", "apps/android/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/web-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix packages/web-client
      - run: npm --prefix packages/web-client run typecheck
      - run: npm --prefix packages/web-client test
      # tauri::generate_context! needs the web client build and the sidecar binary to exist
      - run: npm --prefix packages/web-client run build
      - run: scripts/fetch-livekit.sh
      - run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            artifact: PartyLine-macos-arm64
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
            artifact: PartyLine-windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            args: --bundles deb,appimage
            artifact: PartyLine-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/web-client/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2t64

      - name: LiveKit sidecar
        run: scripts/fetch-livekit.sh

      - run: npm ci --prefix packages/web-client
      - run: npm ci --prefix apps/desktop

      - name: Build installers (no update files, no signing key needed)
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run build:installer -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
